[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-config --strict-markers --basetemp=.pytest_tmp -m "not real_model and not calibration"
filterwarnings =
    error
    # asyncpg/SSL bağlantıları Windows'ta çöp toplama sırasında geç kapanıyor.
    # Bu uyarılar test doğruluğunu etkilemediği için hataya çevirilmiyor.
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning
markers =
    real_model: Tests requiring the real MiniLM model
    calibration: Calibration tests comparing MiniLM and fallback scores
